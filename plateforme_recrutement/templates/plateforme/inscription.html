{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="{% static 'css/inscription.css' %}">
</head>
<body>
    <div class="container">
        <h2>📋 Inscription Recruteur</h2>

        {% if erreur %}
            <p class="erreur">{{ erreur }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Créer mon compte</button>
        </form>

        <p class="lien">
            Déjà un compte ?
            <a href="{% url 'connexion' %}">Se connecter</a>
        </p>
    </div>
</body>
</html>
